<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 352" role="img" aria-labelledby="t d">
  <title id="t">Drei Komponenten des Quality Score</title>
  <desc id="d">Oben der Weg Suchanfrage (siebträger kaufen), Anzeige (Siebträger vom Fachhändler), nach dem Klick die Zielseite (/siebtraeger). Darunter drei Komponenten mit Hebeln: Anzeigenrelevanz zwischen Suche und Anzeige, Hebel: Begriffe aus dem Keyword im Anzeigentext, enge Anzeigengruppen. Erwartete Klickrate an der Anzeige, Hebel: Suchbegriff aufgreifen, klarer Nutzen, eindeutige Handlungsaufforderung. Zielseiten-Erfahrung, Hebel: schnell, übersichtlich, inhaltlich passend. Unten: Quality Score 1 bis 10 ist ein Diagnosewert; verbessert werden die Komponenten.</desc>
  <style>
    /*@FONT@*/
    text { font-family: Geist, 'Helvetica Neue', Arial, sans-serif; }
    .h   { font-size: 17px; font-weight: 600; fill: #16182c; letter-spacing: -0.01em; }
    .sub { font-size: 13px; fill: #555a6e; }
    .n   { font-size: 15px; font-weight: 600; fill: #16182c; }
    .d   { font-size: 13.5px; fill: #3d4255; }
    .s   { font-size: 12.5px; fill: #555a6e; }
    .big { font-size: 24px; font-weight: 600; fill: #16182c; letter-spacing: -0.02em; }
    .num { font-size: 12px; font-weight: 600; fill: #faf9f4; }
    .mono { font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 12.5px; fill: #3d4255; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8f8a7c"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c08a3e"/></marker>
  </defs>
  <rect width="770" height="352" fill="#faf9f4"/>
  <rect x="20" y="20" width="220" height="64" rx="8" fill="#efece3" stroke="#16182c" stroke-width="1.25"/>
  <text class="n" x="36" y="44" text-anchor="start">Suchanfrage</text>
  <text class="mono" x="36" y="68" text-anchor="start">siebträger kaufen</text>
  <rect x="275" y="20" width="220" height="64" rx="8" fill="#efece3" stroke="#16182c" stroke-width="1.25"/>
  <text class="n" x="291" y="44" text-anchor="start">Anzeige</text>
  <text class="d" x="291" y="68" text-anchor="start">Siebträger vom Fachhändler</text>
  <rect x="530" y="20" width="220" height="64" rx="8" fill="#efece3" stroke="#16182c" stroke-width="1.25"/>
  <text class="n" x="546" y="44" text-anchor="start">Zielseite</text>
  <text class="mono" x="546" y="68" text-anchor="start">/siebtraeger</text>
  <line x1="243" y1="52" x2="271" y2="52" stroke="#8f8a7c" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="498" y1="52" x2="526" y2="52" stroke="#8f8a7c" stroke-width="1.5" marker-end="url(#ar)"/>
  <text class="s" x="512" y="40" text-anchor="middle">Klick</text>
  <path d="M130,92 L130,104 L262,104 L262,92" fill="none" stroke="#c08a3e" stroke-width="1.5"/>
  <line x1="150" y1="104" x2="150" y2="118" stroke="#c08a3e" stroke-width="1.5"/>
  <rect x="35" y="120" width="230" height="70" rx="8" fill="#f6ecd8" stroke="#16182c" stroke-width="1.25"/>
  <text class="n" x="49" y="144" text-anchor="start">Anzeigenrelevanz</text>
  <text class="s" x="49" y="166" text-anchor="start">Passt der Anzeigentext zur Suche?</text>
  <text class="s" x="49" y="216" text-anchor="start" style="font-weight:600">Hebel</text>
  <text class="d" x="49" y="236" text-anchor="start">Begriffe aus dem Keyword</text>
  <text class="d" x="49" y="254" text-anchor="start">im Anzeigentext, enge</text>
  <text class="d" x="49" y="272" text-anchor="start">Anzeigengruppen</text>
  <line x1="385" y1="92" x2="385" y2="104" stroke="#c08a3e" stroke-width="1.5"/>
  <line x1="385" y1="104" x2="385" y2="118" stroke="#c08a3e" stroke-width="1.5"/>
  <rect x="270" y="120" width="230" height="70" rx="8" fill="#f6ecd8" stroke="#16182c" stroke-width="1.25"/>
  <text class="n" x="284" y="144" text-anchor="start">Erwartete Klickrate</text>
  <text class="s" x="284" y="166" text-anchor="start">Wie wahrscheinlich ist ein Klick?</text>
  <text class="s" x="284" y="216" text-anchor="start" style="font-weight:600">Hebel</text>
  <text class="d" x="284" y="236" text-anchor="start">Suchbegriff aufgreifen,</text>
  <text class="d" x="284" y="254" text-anchor="start">klarer Nutzen, eindeutige</text>
  <text class="d" x="284" y="272" text-anchor="start">Handlungsaufforderung</text>
  <line x1="640" y1="92" x2="640" y2="104" stroke="#c08a3e" stroke-width="1.5"/>
  <line x1="640" y1="104" x2="640" y2="118" stroke="#c08a3e" stroke-width="1.5"/>
  <rect x="525" y="120" width="230" height="70" rx="8" fill="#f6ecd8" stroke="#16182c" stroke-width="1.25"/>
  <text class="n" x="539" y="144" text-anchor="start">Zielseiten-Erfahrung</text>
  <text class="s" x="539" y="166" text-anchor="start">Hilft die Seite nach dem Klick?</text>
  <text class="s" x="539" y="216" text-anchor="start" style="font-weight:600">Hebel</text>
  <text class="d" x="539" y="236" text-anchor="start">schnell, übersichtlich,</text>
  <text class="d" x="539" y="254" text-anchor="start">inhaltlich passend</text>
  <rect x="20" y="300" width="730" height="40" rx="8" fill="#f3f0e8" stroke="#e2dfd6" stroke-width="1"/>
  <text class="d" x="36" y="325" text-anchor="start">Quality Score 1 bis 10: Diagnosewert. Wir verbessern die drei Komponenten, nicht die Zahl.</text>
</svg>
