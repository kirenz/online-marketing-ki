<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 480" role="img" aria-labelledby="t d">
  <title id="t">Planungsprozess in acht Schritten</title>
  <desc id="d">Acht Schritte auf einem Kreislauf im Uhrzeigersinn: 1 Situationsanalyse, 2 Ziele, 3 Zielgruppen, 4 Strategie und Positionierung, 5 Kanäle und Maßnahmen, 6 Budget, 7 Umsetzung, 8 Controlling. Ein hervorgehobener Bogen führt vom Controlling zurück zur Situationsanalyse: Das Controlling liefert das Lagebild für die nächste Runde.</desc>
