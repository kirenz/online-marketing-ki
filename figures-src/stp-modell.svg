<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 360" role="img" aria-labelledby="t d">
  <title id="t">STP-Modell: Segmentierung, Targeting, Positionierung</title>
  <desc id="d">Drei Felder mit Punkten, die Menschen im Markt darstellen. 1 Segmentierung: Die Punkte bilden vier Gruppen mit ähnlichen Bedürfnissen, gebildet nach geografischen, demografischen, psychografischen und verhaltensbezogenen Kriterien. 2 Targeting: Eine Gruppe ist hervorgehoben, die übrigen sind blass; Leitfragen sind Attraktivität und Passung. 3 Positionierung: Nur das gewählte Segment bleibt, verbunden mit einem klaren Nutzenversprechen, abgegrenzt vom Wettbewerb.</desc>
