<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 408" role="img" aria-labelledby="t d">
  <title id="t">Positionierungskarte der Rösterei Morgenrot</title>
  <desc id="d">Ein Achsenkreuz mit Kaufart (von Einzelkauf bis Versorgung im Abo) und Preis (von günstig bis teuer). Supermarkt und Großversender stehen bei günstig und Einzelkauf, eine Spezialitätenrösterei bei teuer und Einzelkauf, ein Kapselabo bei teuer und Abo. Frei ist der Bereich mittlerer Preis und Abo: frischer Kaffee im Abo. Alle Anbieter sind erfunden.</desc>
  <style>
    /*@FONT@*/
    text { font-family: Geist, 'Helvetica Neue', Arial, sans-serif; }
    .n   { font-size: 15px; font-weight: 600; fill: #16182c; }
    .d   { font-size: 14px; fill: #3d4255; }
    .s   { font-size: 12.5px; fill: #555a6e; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8f8a7c"/></marker>
  </defs>
  <rect width="770" height="408" fill="#faf9f4"/>
  <rect x="90" y="20" width="600" height="320" fill="#f3f0e8" stroke="#e2dfd6"/>
  <line x1="390.0" y1="20" x2="390.0" y2="340" stroke="#e2dfd6" stroke-width="1.5"/>
  <line x1="90" y1="180.0" x2="690" y2="180.0" stroke="#e2dfd6" stroke-width="1.5"/>
  <line x1="90" y1="354" x2="690" y2="354" stroke="#555a6e" stroke-width="1.2" marker-end="url(#ar)"/>
  <text class="s" x="90" y="374" text-anchor="start">Einzelkauf</text>
  <text class="s" x="690" y="374" text-anchor="end">Versorgung im Abo</text>
  <text class="s" x="390" y="374" text-anchor="middle" style="font-weight:600">Kaufart</text>
  <line x1="76" y1="340" x2="76" y2="26" stroke="#555a6e" stroke-width="1.2" marker-end="url(#ar)"/>
  <text class="s" x="68" y="32" text-anchor="end">teuer</text>
  <text class="s" x="68" y="340" text-anchor="end">günstig</text>
  <text class="s" x="68" y="184" text-anchor="end" style="font-weight:600">Preis</text>
  <circle cx="170" cy="300" r="11" fill="#efece3" stroke="#8f8a7c" stroke-width="1.5"/>
  <text class="d" x="188" y="305">Supermarkt</text>
  <circle cx="230" cy="258" r="11" fill="#efece3" stroke="#8f8a7c" stroke-width="1.5"/>
  <text class="d" x="248" y="263">Großversender</text>
  <circle cx="190" cy="70" r="11" fill="#efece3" stroke="#8f8a7c" stroke-width="1.5"/>
  <text class="d" x="208" y="75">Spezialitätenrösterei</text>
  <circle cx="640" cy="62" r="11" fill="#efece3" stroke="#8f8a7c" stroke-width="1.5"/>
  <text class="d" x="622" y="67" text-anchor="end">Kapselabo</text>
  <ellipse cx="560" cy="190" rx="112" ry="54" fill="#f6ecd8" stroke="#c08a3e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="n" x="560" y="186" text-anchor="middle">freier Platz</text>
  <text class="s" x="560" y="206" text-anchor="middle">frisch im Abo, mittlerer Preis</text>
  <text class="s" x="90" y="396" text-anchor="start">Die Achsen sind die Dimensionen, nach denen die Zielgruppe entscheidet. Alle Anbieter sind erfunden.</text>
</svg>
