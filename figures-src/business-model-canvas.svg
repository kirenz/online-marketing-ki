<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 405" role="img" aria-labelledby="t d">
  <title id="t">Business Model Canvas</title>
  <desc id="d">Das Raster mit neun Bausteinen. Links, nach innen gerichtet: Schlüsselpartner, Schlüsselaktivitäten, Schlüsselressourcen und darunter Kostenstruktur. In der Mitte hervorgehoben: Wertangebote, die beide Seiten verbinden. Rechts, nach außen gerichtet: Kundenbeziehungen, Kanäle, Kundensegmente und darunter Einnahmequellen. Jedes Feld nennt seine Leitfrage.</desc>
  <style>
    /*@FONT@*/
    text { font-family: Geist, 'Helvetica Neue', Arial, sans-serif; }
    .h   { font-size: 17px; font-weight: 600; fill: #16182c; letter-spacing: -0.01em; }
    .sub { font-size: 13px; fill: #555a6e; }
    .n   { font-size: 15px; font-weight: 600; fill: #16182c; }
    .d   { font-size: 13.5px; fill: #3d4255; }
    .s   { font-size: 12.5px; fill: #555a6e; }
    .big { font-size: 24px; font-weight: 600; fill: #16182c; letter-spacing: -0.02em; }
    .num { font-size: 12px; font-weight: 600; fill: #faf9f4; }
    .mono { font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 12.5px; fill: #3d4255; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8f8a7c"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c08a3e"/></marker>
  </defs>
  <rect width="770" height="405" fill="#faf9f4"/>
  <rect x="20" y="70" width="146" height="240" fill="#e6e9ef" stroke="#16182c" stroke-width="1"/>
  <text class="n" x="32" y="94" text-anchor="start">Schlüssel-</text>
  <text class="n" x="32" y="111" text-anchor="start">partner</text>
  <text class="s" x="32" y="134" text-anchor="start">Wer hilft uns?</text>
  <rect x="166" y="70" width="146" height="120" fill="#e6e9ef" stroke="#16182c" stroke-width="1"/>
  <text class="n" x="178" y="94" text-anchor="start">Schlüssel-</text>
  <text class="n" x="178" y="111" text-anchor="start">aktivitäten</text>
  <text class="s" x="178" y="134" text-anchor="start">Was müssen wir tun?</text>
  <rect x="166" y="190" width="146" height="120" fill="#e6e9ef" stroke="#16182c" stroke-width="1"/>
  <text class="n" x="178" y="214" text-anchor="start">Schlüssel-</text>
  <text class="n" x="178" y="231" text-anchor="start">ressourcen</text>
  <text class="s" x="178" y="254" text-anchor="start">Was brauchen wir</text>
  <text class="s" x="178" y="270" text-anchor="start">dafür?</text>
  <rect x="312" y="70" width="146" height="240" fill="#f6ecd8" stroke="#16182c" stroke-width="1"/>
  <text class="n" x="324" y="94" text-anchor="start">Wertangebote</text>
  <text class="s" x="324" y="117" text-anchor="start">Welchen Nutzen</text>
  <text class="s" x="324" y="133" text-anchor="start">stiften wir?</text>
  <rect x="458" y="70" width="146" height="120" fill="#efece3" stroke="#16182c" stroke-width="1"/>
  <text class="n" x="470" y="94" text-anchor="start">Kunden-</text>
  <text class="n" x="470" y="111" text-anchor="start">beziehungen</text>
  <text class="s" x="470" y="134" text-anchor="start">Welche Beziehung</text>
  <text class="s" x="470" y="150" text-anchor="start">pflegen wir?</text>
  <rect x="458" y="190" width="146" height="120" fill="#efece3" stroke="#16182c" stroke-width="1"/>
  <text class="n" x="470" y="214" text-anchor="start">Kanäle</text>
  <text class="s" x="470" y="237" text-anchor="start">Wie erreichen wir</text>
  <text class="s" x="470" y="253" text-anchor="start">die Kundschaft?</text>
  <rect x="604" y="70" width="146" height="240" fill="#efece3" stroke="#16182c" stroke-width="1"/>
  <text class="n" x="616" y="94" text-anchor="start">Kunden-</text>
  <text class="n" x="616" y="111" text-anchor="start">segmente</text>
  <text class="s" x="616" y="134" text-anchor="start">Für wen schaffen</text>
  <text class="s" x="616" y="150" text-anchor="start">wir Wert?</text>
  <rect x="20" y="310" width="365" height="82" fill="#e6e9ef" stroke="#16182c" stroke-width="1"/>
  <text class="n" x="32" y="334" text-anchor="start">Kostenstruktur</text>
  <text class="s" x="32" y="357" text-anchor="start">Welche Kosten entstehen?</text>
  <rect x="385" y="310" width="365" height="82" fill="#efece3" stroke="#16182c" stroke-width="1"/>
  <text class="n" x="397" y="334" text-anchor="start">Einnahmequellen</text>
  <text class="s" x="397" y="357" text-anchor="start">Wofür wird bezahlt?</text>
  <rect x="20" y="70" width="730" height="322" fill="none" stroke="#16182c" stroke-width="1.5"/>
  <path d="M20,52 L20,46 L312,46 L312,52" fill="none" stroke="#555a6e" stroke-width="1.2"/>
  <text class="s" x="166" y="34" text-anchor="middle" style="font-weight:600">nach innen: was wir dafür brauchen</text>
  <path d="M458,52 L458,46 L750,46 L750,52" fill="none" stroke="#555a6e" stroke-width="1.2"/>
  <text class="s" x="604" y="34" text-anchor="middle" style="font-weight:600">nach außen: Kundschaft und Erträge</text>
  <text class="s" x="385" y="34" text-anchor="middle" style="font-weight:600;fill:#c08a3e">verbindet</text>
  <line x1="385" y1="40" x2="385" y2="60" stroke="#c08a3e" stroke-width="1.5" marker-end="url(#ao)"/>
</svg>
