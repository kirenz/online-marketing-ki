<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 190" role="img" aria-labelledby="t d">
  <title id="t">Kundenreise von Fremden zu Fürsprechern</title>
  <desc id="d">Fünf Stationen von links nach rechts: Fremde, Besucher, Interessenten, Kunden, Fürsprecher. Zwischen den Stationen stehen die Marketingaufgaben: Anwerben mit Suchmaschinenwerbung und SEO, Überzeugen mit Content-Marketing, Gewinnen mit Angebot und Conversion, Binden mit Service und Community.</desc>
