<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 408" role="img" aria-labelledby="t d">
  <title id="t">Positionierungskarte</title>
  <desc id="d">Ein Achsenkreuz mit Spezialisierung (von breitem Sortiment bis spezialisiert) und Preis (von niedrig bis hoch). Vier Wettbewerber A bis D stehen überwiegend im Bereich breit und günstig bis mittel. Oben rechts, spezialisiert und hochpreisig, ist ein freier, attraktiver Platz markiert. Fiktives Beispiel.</desc>
  <style>
    /*@FONT@*/
    text { font-family: Geist, 'Helvetica Neue', Arial, sans-serif; }
    .h   { font-size: 17px; font-weight: 600; fill: #16182c; letter-spacing: -0.01em; }
    .sub { font-size: 13px; fill: #555a6e; }
    .n   { font-size: 15px; font-weight: 600; fill: #16182c; }
    .d   { font-size: 13.5px; fill: #3d4255; }
    .s   { font-size: 12.5px; fill: #555a6e; }
    .big { font-size: 24px; font-weight: 600; fill: #16182c; letter-spacing: -0.02em; }
    .num { font-size: 12px; font-weight: 600; fill: #faf9f4; }
    .mono { font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 12.5px; fill: #3d4255; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8f8a7c"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c08a3e"/></marker>
  </defs>
  <rect width="770" height="408" fill="#faf9f4"/>
  <rect x="90" y="20" width="600" height="320" fill="#f3f0e8" stroke="#e2dfd6"/>
  <line x1="390.0" y1="20" x2="390.0" y2="340" stroke="#e2dfd6" stroke-width="1.5"/>
  <line x1="90" y1="180.0" x2="690" y2="180.0" stroke="#e2dfd6" stroke-width="1.5"/>
  <line x1="90" y1="354" x2="690" y2="354" stroke="#555a6e" stroke-width="1.2" marker-end="url(#ar)"/>
  <text class="s" x="90" y="374" text-anchor="start">breites Sortiment</text>
  <text class="s" x="690" y="374" text-anchor="end">spezialisiert</text>
  <text class="s" x="390" y="374" text-anchor="middle" style="font-weight:600">Spezialisierung</text>
  <line x1="76" y1="340" x2="76" y2="26" stroke="#555a6e" stroke-width="1.2" marker-end="url(#ar)"/>
  <text class="s" x="68" y="32" text-anchor="end">hoch</text>
  <text class="s" x="68" y="340" text-anchor="end">niedrig</text>
  <text class="s" x="68" y="184" text-anchor="end" style="font-weight:600">Preis</text>
  <circle cx="180" cy="280" r="17" fill="#efece3" stroke="#8f8a7c" stroke-width="1.5"/>
  <text class="n" x="180" y="285" text-anchor="middle" style="fill:#555a6e">A</text>
  <circle cx="250" cy="240" r="17" fill="#efece3" stroke="#8f8a7c" stroke-width="1.5"/>
  <text class="n" x="250" y="245" text-anchor="middle" style="fill:#555a6e">B</text>
  <circle cx="215" cy="100" r="17" fill="#efece3" stroke="#8f8a7c" stroke-width="1.5"/>
  <text class="n" x="215" y="105" text-anchor="middle" style="fill:#555a6e">C</text>
  <circle cx="330" cy="290" r="17" fill="#efece3" stroke="#8f8a7c" stroke-width="1.5"/>
  <text class="n" x="330" y="295" text-anchor="middle" style="fill:#555a6e">D</text>
  <text class="s" x="265" y="322" text-anchor="middle">Wettbewerb drängt sich hier</text>
  <circle cx="580" cy="100" r="60" fill="#f6ecd8" stroke="#c08a3e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="n" x="580" y="96" text-anchor="middle">freier,</text>
  <text class="s" x="580" y="115" text-anchor="middle">attraktiver Platz</text>
  <text class="s" x="90" y="396" text-anchor="start">Die Achsen sind die Dimensionen, die für die Zielgruppe entscheiden. Fiktives Beispiel.</text>
</svg>
