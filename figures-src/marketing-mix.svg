<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 362" role="img" aria-labelledby="t d">
  <title id="t">Vier P und vier C</title>
  <desc id="d">Links die vier P aus Sicht des Anbieters: Product, Price, Place, Promotion. Pfeile führen zu den vier C aus Sicht der Kundschaft: Customer Value (Kundennutzen), Cost (Gesamtkosten), Convenience (Bequemlichkeit), Communication (Dialog). Rechts je eine Leitfrage. Darunter der Satz: Die Hebel wirken nur zusammen.</desc>
  <style>
    /*@FONT@*/
    text { font-family: Geist, 'Helvetica Neue', Arial, sans-serif; }
    .h   { font-size: 17px; font-weight: 600; fill: #16182c; letter-spacing: -0.01em; }
    .sub { font-size: 13px; fill: #555a6e; }
    .n   { font-size: 15px; font-weight: 600; fill: #16182c; }
    .d   { font-size: 13.5px; fill: #3d4255; }
    .s   { font-size: 12.5px; fill: #555a6e; }
    .big { font-size: 24px; font-weight: 600; fill: #16182c; letter-spacing: -0.02em; }
    .num { font-size: 12px; font-weight: 600; fill: #faf9f4; }
    .mono { font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 12.5px; fill: #3d4255; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8f8a7c"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c08a3e"/></marker>
  </defs>
  <rect width="770" height="362" fill="#faf9f4"/>
  <text class="h" x="20" y="30" text-anchor="start">Vier P</text>
  <text class="sub" x="20" y="48" text-anchor="start">Sicht des Anbieters</text>
  <text class="h" x="300" y="30" text-anchor="start">Vier C</text>
  <text class="sub" x="300" y="48" text-anchor="start">Sicht der Kundschaft</text>
  <text class="sub" x="530" y="48" text-anchor="start">Leitfrage</text>
  <rect x="20" y="66" width="220" height="52" rx="8" fill="#e6e9ef" stroke="#16182c" stroke-width="1.25"/>
  <text class="n" x="36" y="88" text-anchor="start">Product</text>
  <text class="s" x="36" y="107" text-anchor="start">Produkt</text>
  <line x1="246" y1="92" x2="294" y2="92" stroke="#8f8a7c" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="300" y="66" width="220" height="52" rx="8" fill="#f6ecd8" stroke="#16182c" stroke-width="1.25"/>
  <text class="n" x="316" y="88" text-anchor="start">Customer Value</text>
  <text class="s" x="316" y="107" text-anchor="start">Kundennutzen</text>
  <text class="d" x="530" y="88" text-anchor="start">Welchen Nutzen hat</text>
  <text class="d" x="530" y="106" text-anchor="start">die Kundschaft?</text>
  <rect x="20" y="132" width="220" height="52" rx="8" fill="#e6e9ef" stroke="#16182c" stroke-width="1.25"/>
  <text class="n" x="36" y="154" text-anchor="start">Price</text>
  <text class="s" x="36" y="173" text-anchor="start">Preis</text>
  <line x1="246" y1="158" x2="294" y2="158" stroke="#8f8a7c" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="300" y="132" width="220" height="52" rx="8" fill="#f6ecd8" stroke="#16182c" stroke-width="1.25"/>
  <text class="n" x="316" y="154" text-anchor="start">Cost</text>
  <text class="s" x="316" y="173" text-anchor="start">Gesamtkosten</text>
  <text class="d" x="530" y="154" text-anchor="start">Was kostet es</text>
  <text class="d" x="530" y="172" text-anchor="start">die Kundschaft insgesamt?</text>
  <rect x="20" y="198" width="220" height="52" rx="8" fill="#e6e9ef" stroke="#16182c" stroke-width="1.25"/>
  <text class="n" x="36" y="220" text-anchor="start">Place</text>
  <text class="s" x="36" y="239" text-anchor="start">Distribution</text>
  <line x1="246" y1="224" x2="294" y2="224" stroke="#8f8a7c" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="300" y="198" width="220" height="52" rx="8" fill="#f6ecd8" stroke="#16182c" stroke-width="1.25"/>
  <text class="n" x="316" y="220" text-anchor="start">Convenience</text>
  <text class="s" x="316" y="239" text-anchor="start">Bequemlichkeit</text>
  <text class="d" x="530" y="220" text-anchor="start">Wie einfach ist</text>
  <text class="d" x="530" y="238" text-anchor="start">der Zugang?</text>
  <rect x="20" y="264" width="220" height="52" rx="8" fill="#e6e9ef" stroke="#16182c" stroke-width="1.25"/>
  <text class="n" x="36" y="286" text-anchor="start">Promotion</text>
  <text class="s" x="36" y="305" text-anchor="start">Kommunikation</text>
  <line x1="246" y1="290" x2="294" y2="290" stroke="#8f8a7c" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="300" y="264" width="220" height="52" rx="8" fill="#f6ecd8" stroke="#16182c" stroke-width="1.25"/>
  <text class="n" x="316" y="286" text-anchor="start">Communication</text>
  <text class="s" x="316" y="305" text-anchor="start">Dialog</text>
  <text class="d" x="530" y="286" text-anchor="start">Wie entsteht ein</text>
  <text class="d" x="530" y="304" text-anchor="start">echter Austausch?</text>
  <text class="d" x="20" y="350" text-anchor="start">Die Hebel wirken nur zusammen: Sie sollen dieselbe Geschichte erzählen.</text>
</svg>
