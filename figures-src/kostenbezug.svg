<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 304" role="img" aria-labelledby="t d">
  <title id="t">Ein Kostenblock, verschiedene Bezugsgrößen</title>
  <desc id="d">Oben die Werbekosten einer Woche: 2.000 Euro. Darunter vier Kennzahlen aus dem fiktiven Shop-Beispiel: 2.000 Euro geteilt durch 1.000 Klicks ergibt einen CPC von 2 Euro. Geteilt durch 40 Bestellungen ergibt 50 Euro Kosten je Bestellung, kein Kunden-CAC. Geteilt durch 25 Neukunden ergibt einen Medien-CAC von 80 Euro. 4.000 Euro zugeordneter Nettoumsatz geteilt durch 2.000 Euro ergibt einen ROAS von 2, also Umsatz je Werbe-Euro, kein Gewinn.</desc>
  <style>
    /*@FONT@*/
    text { font-family: Geist, 'Helvetica Neue', Arial, sans-serif; }
    .h   { font-size: 17px; font-weight: 600; fill: #16182c; letter-spacing: -0.01em; }
    .sub { font-size: 13px; fill: #555a6e; }
    .n   { font-size: 15px; font-weight: 600; fill: #16182c; }
    .d   { font-size: 13.5px; fill: #3d4255; }
    .s   { font-size: 12.5px; fill: #555a6e; }
    .big { font-size: 24px; font-weight: 600; fill: #16182c; letter-spacing: -0.02em; }
    .num { font-size: 12px; font-weight: 600; fill: #faf9f4; }
    .mono { font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 12.5px; fill: #3d4255; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8f8a7c"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c08a3e"/></marker>
  </defs>
  <rect width="770" height="304" fill="#faf9f4"/>
  <rect x="285" y="16" width="200" height="56" rx="8" fill="#f6ecd8" stroke="#16182c" stroke-width="1.5"/>
  <text class="s" x="385" y="40" text-anchor="middle">Werbekosten der Woche</text>
  <text class="big" x="385" y="63" text-anchor="middle">2.000 €</text>
  <path d="M385,74 L385,94 L108.0,94 L108.0,110" fill="none" stroke="#8f8a7c" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="20" y="114" width="176" height="150" rx="8" fill="#efece3" stroke="#16182c" stroke-width="1.25"/>
  <text class="s" x="108" y="138" text-anchor="middle">2.000 € ÷ 1.000 Klicks</text>
  <text class="big" x="108" y="176" text-anchor="middle">2 €</text>
  <text class="n" x="108" y="202" text-anchor="middle">CPC</text>
  <text class="s" x="108" y="224" text-anchor="middle">Werbekosten je Klick</text>
  <path d="M385,74 L385,94 L296.0,94 L296.0,110" fill="none" stroke="#8f8a7c" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="208" y="114" width="176" height="150" rx="8" fill="#efece3" stroke="#16182c" stroke-width="1.25"/>
  <text class="s" x="296" y="138" text-anchor="middle">2.000 € ÷ 40 Bestellungen</text>
  <text class="big" x="296" y="176" text-anchor="middle">50 €</text>
  <text class="n" x="296" y="202" text-anchor="middle">Kosten je Bestellung</text>
  <text class="s" x="296" y="224" text-anchor="middle">kein Kunden-CAC</text>
  <path d="M385,74 L385,94 L484.0,94 L484.0,110" fill="none" stroke="#8f8a7c" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="396" y="114" width="176" height="150" rx="8" fill="#efece3" stroke="#16182c" stroke-width="1.25"/>
  <text class="s" x="484" y="138" text-anchor="middle">2.000 € ÷ 25 Neukunden</text>
  <text class="big" x="484" y="176" text-anchor="middle">80 €</text>
  <text class="n" x="484" y="202" text-anchor="middle">Medien-CAC</text>
  <text class="s" x="484" y="224" text-anchor="middle">je erstmals kaufende</text>
  <text class="s" x="484" y="240" text-anchor="middle">Person</text>
  <path d="M385,74 L385,94 L672.0,94 L672.0,110" fill="none" stroke="#8f8a7c" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="584" y="114" width="176" height="150" rx="8" fill="#e6e9ef" stroke="#16182c" stroke-width="1.25"/>
  <text class="s" x="672" y="138" text-anchor="middle">4.000 € Umsatz ÷ 2.000 €</text>
  <text class="big" x="672" y="176" text-anchor="middle">2</text>
  <text class="n" x="672" y="202" text-anchor="middle">ROAS</text>
  <text class="s" x="672" y="224" text-anchor="middle">Umsatz je Werbe-Euro,</text>
  <text class="s" x="672" y="240" text-anchor="middle">kein Gewinn</text>
  <text class="d" x="385" y="292" text-anchor="middle">Gleicher Zähler, andere Nenner: Jede Kennzahl beantwortet eine andere Frage.</text>
</svg>
