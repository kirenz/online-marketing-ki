<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 376" role="img" aria-labelledby="t d">
  <title id="t">Chat, Assistent, Agent</title>
  <desc id="d">Drei ansteigende Stufen. Chat: einzelne Prompts in einem KI-Fenster, Beispiel Anzeige in fünf Varianten texten. Assistent: Anweisungen direkt im Programm, Beispiel in Word einen Berichtsentwurf erstellen. Agent: Ziel vorgeben, Teilschritte laufen selbst, mit den Schritten Teilschritte planen, mit Werkzeugen ausführen, Entwurf zur Freigabe; Beispiel Meeting vorbereiten lassen. Ein Pfeil darunter: mehr Autonomie verlangt mehr Aufsicht, die Verantwortung bleibt bei uns.</desc>
  <style>
    /*@FONT@*/
    text { font-family: Geist, 'Helvetica Neue', Arial, sans-serif; }
    .h   { font-size: 17px; font-weight: 600; fill: #16182c; letter-spacing: -0.01em; }
    .sub { font-size: 13px; fill: #555a6e; }
    .n   { font-size: 15px; font-weight: 600; fill: #16182c; }
    .d   { font-size: 13.5px; fill: #3d4255; }
    .s   { font-size: 12.5px; fill: #555a6e; }
    .big { font-size: 24px; font-weight: 600; fill: #16182c; letter-spacing: -0.02em; }
    .num { font-size: 12px; font-weight: 600; fill: #faf9f4; }
    .mono { font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 12.5px; fill: #3d4255; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8f8a7c"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c08a3e"/></marker>
  </defs>
  <rect width="770" height="376" fill="#faf9f4"/>
  <rect x="20" y="150" width="230" height="164" rx="8" fill="#efece3" stroke="#16182c" stroke-width="1.25"/>
  <text class="h" x="36" y="178" text-anchor="start">Chat</text>
  <text class="s" x="36" y="200" text-anchor="start">einzelne Prompts in</text>
  <text class="s" x="36" y="216" text-anchor="start">einem KI-Fenster</text>
  <text class="s" x="36" y="262" text-anchor="start" style="font-weight:600">Beispiel</text>
  <text class="d" x="36" y="280" text-anchor="start">Anzeige in fünf</text>
  <text class="d" x="36" y="298" text-anchor="start">Varianten texten</text>
  <rect x="270" y="100" width="230" height="214" rx="8" fill="#e6e9ef" stroke="#16182c" stroke-width="1.25"/>
  <text class="h" x="286" y="128" text-anchor="start">Assistent</text>
  <text class="s" x="286" y="150" text-anchor="start">Anweisungen direkt</text>
  <text class="s" x="286" y="166" text-anchor="start">im Programm</text>
  <text class="s" x="286" y="262" text-anchor="start" style="font-weight:600">Beispiel</text>
  <text class="d" x="286" y="280" text-anchor="start">In Word einen</text>
  <text class="d" x="286" y="298" text-anchor="start">Berichtsentwurf erstellen</text>
  <rect x="520" y="50" width="230" height="264" rx="8" fill="#f6ecd8" stroke="#16182c" stroke-width="1.25"/>
  <text class="h" x="536" y="78" text-anchor="start">Agent</text>
  <text class="s" x="536" y="100" text-anchor="start">Ziel vorgeben, Teilschritte</text>
  <text class="s" x="536" y="116" text-anchor="start">laufen selbst</text>
  <text class="s" x="536" y="262" text-anchor="start" style="font-weight:600">Beispiel</text>
  <text class="d" x="536" y="280" text-anchor="start">Meeting vorbereiten</text>
  <text class="d" x="536" y="298" text-anchor="start">lassen</text>
  <rect x="536" y="134" width="198" height="24" rx="12" fill="#faf9f4" stroke="#c08a3e" stroke-width="1.2"/>
  <text class="s" x="548" y="150" text-anchor="start" style="fill:#16182c">Teilschritte planen</text>
  <rect x="536" y="162" width="198" height="24" rx="12" fill="#faf9f4" stroke="#c08a3e" stroke-width="1.2"/>
  <text class="s" x="548" y="178" text-anchor="start" style="fill:#16182c">mit Werkzeugen ausführen</text>
  <rect x="536" y="190" width="198" height="24" rx="12" fill="#faf9f4" stroke="#c08a3e" stroke-width="1.2"/>
  <text class="s" x="548" y="206" text-anchor="start" style="fill:#16182c">Entwurf zur Freigabe</text>
  <line x1="20" y1="344" x2="750" y2="344" stroke="#555a6e" stroke-width="1.2" marker-end="url(#ar)"/>
  <text class="s" x="20" y="364" text-anchor="start" style="font-weight:600">mehr Autonomie</text>
  <text class="s" x="750" y="364" text-anchor="end" style="font-weight:600;fill:#b85a3a">mehr Aufsicht: prüfen, Rechte begrenzen, Verantwortung bleibt bei uns</text>
</svg>
