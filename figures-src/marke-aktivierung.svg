<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 326" role="img" aria-labelledby="t d">
  <title id="t">Markenaufbau und Aktivierung</title>
  <desc id="d">Zwei Kästen. Markenaufbau: wirkt langfristig, spricht eine breite Zielgruppe an, sorgt dafür, dass wir in Erwägung gezogen werden. Aktivierung: wirkt kurzfristig, spricht kaufbereite Kontakte an, löst Handlungen wie Anfragen oder Anmeldungen aus. Darunter ein Budgetbalken, ungefähr hälftig geteilt. Hinweis: Orientierung aus untersuchten B2B-Kampagnen nach Binet und Field, keine feste Regel.</desc>
  <style>
    /*@FONT@*/
    text { font-family: Geist, 'Helvetica Neue', Arial, sans-serif; }
    .h   { font-size: 17px; font-weight: 600; fill: #16182c; letter-spacing: -0.01em; }
    .sub { font-size: 13px; fill: #555a6e; }
    .n   { font-size: 15px; font-weight: 600; fill: #16182c; }
    .d   { font-size: 13.5px; fill: #3d4255; }
    .s   { font-size: 12.5px; fill: #555a6e; }
    .big { font-size: 24px; font-weight: 600; fill: #16182c; letter-spacing: -0.02em; }
    .num { font-size: 12px; font-weight: 600; fill: #faf9f4; }
    .mono { font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 12.5px; fill: #3d4255; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8f8a7c"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c08a3e"/></marker>
  </defs>
  <rect width="770" height="326" fill="#faf9f4"/>
  <rect x="20" y="20" width="360" height="176" rx="8" fill="#e6e9ef" stroke="#16182c" stroke-width="1.25"/>
  <text class="h" x="40" y="50" text-anchor="start">Markenaufbau</text>
  <text class="d" x="40" y="80" text-anchor="start">wirkt langfristig</text>
  <text class="d" x="40" y="102" text-anchor="start">spricht eine breite Zielgruppe an</text>
  <text class="d" x="40" y="124" text-anchor="start">sorgt dafür, dass wir überhaupt</text>
  <text class="d" x="40" y="146" text-anchor="start">in Erwägung gezogen werden</text>
  <rect x="390" y="20" width="360" height="176" rx="8" fill="#f6ecd8" stroke="#16182c" stroke-width="1.25"/>
  <text class="h" x="410" y="50" text-anchor="start">Aktivierung</text>
  <text class="d" x="410" y="80" text-anchor="start">wirkt kurzfristig</text>
  <text class="d" x="410" y="102" text-anchor="start">spricht kaufbereite Kontakte an</text>
  <text class="d" x="410" y="124" text-anchor="start">löst Handlungen aus, etwa</text>
  <text class="d" x="410" y="146" text-anchor="start">Anfragen oder Anmeldungen</text>
  <text class="n" x="20" y="232" text-anchor="start">Budget</text>
  <rect x="90" y="216" width="330" height="26" rx="4" fill="#3f63a8"/>
  <rect x="422" y="216" width="328" height="26" rx="4" fill="#b98232"/>
  <text class="s" x="255" y="262" text-anchor="middle" style="fill:#16182c">Markenaufbau, ungefähr die Hälfte</text>
  <text class="s" x="586" y="262" text-anchor="middle" style="fill:#16182c">Aktivierung, ungefähr die Hälfte</text>
  <text class="s" x="20" y="296" text-anchor="start">Orientierung aus untersuchten B2B-Kampagnen (Binet und Field), keine feste Regel. Kaufzyklus, Bekanntheit,</text>
  <text class="s" x="20" y="313" text-anchor="start">Ziel und Messhorizont bestimmen die konkrete Aufteilung.</text>
</svg>
