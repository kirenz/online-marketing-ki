<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 352" role="img" aria-labelledby="t d">
  <title id="t">Die drei Core Web Vitals</title>
  <desc id="d">Drei stilisierte Browserfenster. LCP, Largest Contentful Paint, Ladewahrnehmung: Ein großer Inhaltsblock ist hervorgehoben; Frage: Wann erscheint der größte sichtbare Inhalt? INP, Interaction to Next Paint, Reaktionsfähigkeit: Ein Klick auf Absenden führt zu einer sichtbaren Reaktion; Frage: Wie schnell reagiert die Seite sichtbar auf Eingaben? CLS, Cumulative Layout Shift, visuelle Stabilität: Ein nachgeladenes Banner schiebt eine Schaltfläche nach unten; Frage: Wie stark verrutschen Elemente ungewollt? Hinweis: Zielwerte in der aktuellen Dokumentation nachschlagen.</desc>
  <style>
    /*@FONT@*/
    text { font-family: Geist, 'Helvetica Neue', Arial, sans-serif; }
    .h   { font-size: 17px; font-weight: 600; fill: #16182c; letter-spacing: -0.01em; }
    .sub { font-size: 13px; fill: #555a6e; }
    .n   { font-size: 15px; font-weight: 600; fill: #16182c; }
    .d   { font-size: 13.5px; fill: #3d4255; }
    .s   { font-size: 12.5px; fill: #555a6e; }
    .big { font-size: 24px; font-weight: 600; fill: #16182c; letter-spacing: -0.02em; }
    .num { font-size: 12px; font-weight: 600; fill: #faf9f4; }
    .mono { font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 12.5px; fill: #3d4255; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8f8a7c"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c08a3e"/></marker>
  </defs>
  <rect width="770" height="352" fill="#faf9f4"/>
  <text class="h" x="20" y="30" text-anchor="start">LCP</text>
  <text class="d" x="62" y="30" text-anchor="start">Ladewahrnehmung</text>
  <text class="s" x="20" y="50" text-anchor="start">Largest Contentful Paint</text>
  <rect x="20" y="66" width="230" height="190" rx="8" fill="#faf9f4" stroke="#16182c" stroke-width="1.25"/>
  <line x1="20" y1="88" x2="250" y2="88" stroke="#e2dfd6" stroke-width="1.2"/>
  <circle cx="34" cy="77" r="3.2" fill="#e2dfd6"/>
  <circle cx="46" cy="77" r="3.2" fill="#e2dfd6"/>
  <circle cx="58" cy="77" r="3.2" fill="#e2dfd6"/>
  <rect x="34" y="100" width="202" height="86" rx="4" fill="#f6ecd8" stroke="#c08a3e" stroke-width="1.5"/>
  <text class="s" x="135" y="148" text-anchor="middle" style="fill:#16182c">größter Inhalt</text>
  <rect x="34" y="198" width="182" height="6" rx="3" fill="#e2dfd6"/>
  <rect x="34" y="212" width="141" height="6" rx="3" fill="#e2dfd6"/>
  <rect x="34" y="226" width="101" height="6" rx="3" fill="#e2dfd6"/>
  <text class="d" x="20" y="282" text-anchor="start">Wann erscheint der größte</text>
  <text class="d" x="20" y="300" text-anchor="start">sichtbare Inhalt?</text>
  <text class="h" x="270" y="30" text-anchor="start">INP</text>
  <text class="d" x="312" y="30" text-anchor="start">Reaktionsfähigkeit</text>
  <text class="s" x="270" y="50" text-anchor="start">Interaction to Next Paint</text>
  <rect x="270" y="66" width="230" height="190" rx="8" fill="#faf9f4" stroke="#16182c" stroke-width="1.25"/>
  <line x1="270" y1="88" x2="500" y2="88" stroke="#e2dfd6" stroke-width="1.2"/>
  <circle cx="284" cy="77" r="3.2" fill="#e2dfd6"/>
  <circle cx="296" cy="77" r="3.2" fill="#e2dfd6"/>
  <circle cx="308" cy="77" r="3.2" fill="#e2dfd6"/>
  <rect x="284" y="102" width="192" height="6" rx="3" fill="#e2dfd6"/>
  <rect x="284" y="116" width="162" height="6" rx="3" fill="#e2dfd6"/>
  <rect x="284" y="130" width="131" height="6" rx="3" fill="#e2dfd6"/>
  <rect x="284" y="144" width="101" height="6" rx="3" fill="#e2dfd6"/>
  <rect x="284" y="172" width="96" height="30" rx="15" fill="#efece3" stroke="#16182c" stroke-width="1.2"/>
  <text class="s" x="332" y="192" text-anchor="middle" style="fill:#16182c">Absenden</text>
  <path d="M362,194 l0,16 l4,-4 l4,8 l3,-1.5 l-4,-8 l6,0 Z" fill="#16182c"/>
  <rect x="394" y="172" width="92" height="30" rx="4" fill="#f6ecd8" stroke="#c08a3e" stroke-width="1.5"/>
  <text class="s" x="440" y="192" text-anchor="middle" style="fill:#16182c">Reaktion</text>
  <line x1="382" y1="187" x2="391" y2="187" stroke="#c08a3e" stroke-width="1.5" marker-end="url(#ao)"/>
  <text class="d" x="270" y="282" text-anchor="start">Wie schnell reagiert die Seite</text>
  <text class="d" x="270" y="300" text-anchor="start">sichtbar auf Eingaben?</text>
  <text class="h" x="520" y="30" text-anchor="start">CLS</text>
  <text class="d" x="562" y="30" text-anchor="start">visuelle Stabilität</text>
  <text class="s" x="520" y="50" text-anchor="start">Cumulative Layout Shift</text>
  <rect x="520" y="66" width="230" height="190" rx="8" fill="#faf9f4" stroke="#16182c" stroke-width="1.25"/>
  <line x1="520" y1="88" x2="750" y2="88" stroke="#e2dfd6" stroke-width="1.2"/>
  <circle cx="534" cy="77" r="3.2" fill="#e2dfd6"/>
  <circle cx="546" cy="77" r="3.2" fill="#e2dfd6"/>
  <circle cx="558" cy="77" r="3.2" fill="#e2dfd6"/>
  <rect x="534" y="100" width="202" height="30" rx="15" fill="none" stroke="#8f8a7c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text class="s" x="635" y="120" text-anchor="middle">hier wollten wir klicken</text>
  <rect x="534" y="138" width="202" height="44" rx="4" fill="#f6e4dc" stroke="#b85a3a" stroke-width="1.5"/>
  <text class="s" x="635" y="165" text-anchor="middle" style="fill:#16182c">nachgeladenes Banner</text>
  <rect x="534" y="190" width="202" height="30" rx="15" fill="#efece3" stroke="#16182c" stroke-width="1.2"/>
  <text class="s" x="635" y="210" text-anchor="middle" style="fill:#16182c">Schaltfläche</text>
  <line x1="728" y1="132" x2="728" y2="186" stroke="#b85a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  <text class="d" x="520" y="282" text-anchor="start">Wie stark verrutschen</text>
  <text class="d" x="520" y="300" text-anchor="start">Elemente ungewollt?</text>
  <text class="s" x="20" y="340" text-anchor="start">Konkrete Zielwerte legt Google fest und passt sie an; wir schlagen sie in der aktuellen Dokumentation nach.</text>
</svg>
