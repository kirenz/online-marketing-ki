<!-- Core Web Vitals zum Erleben: drei Mini-Demos (LCP: das große Bild kommt spät, INP: der Knopf reagiert verzögert, CLS: ein Banner schiebt den Knopf weg). Demo-Zeiten, keine Grenzwerte. Gleiches Schaubild wie in der Lernplattform-Lektion core-web-vitals (vwa-digitales-marketing). Einbindung im Deck als Raw-HTML-Block. -->
<style>.reveal .rw-cwv { font-size: 0.8em; --w-ink: var(--ink); --w-soft: var(--ink-soft); --w-rule: var(--rule); --w-card: var(--paper); --w-deep: var(--paper-deep); --w-blue: var(--primary); --w-ochre: var(--ochre); --w-terra: var(--terracotta); }</style>
<div class="rw-cwv" id="rw-cwv" lang="de">
  <div class="rw-cwv__tabs" role="tablist" aria-label="Kennzahl wählen">
    <button type="button" role="tab" data-k="lcp"><b>LCP</b><span>Laden</span></button>
    <button type="button" role="tab" data-k="inp"><b>INP</b><span>Reagieren</span></button>
    <button type="button" role="tab" data-k="cls"><b>CLS</b><span>Stabil bleiben</span></button>
  </div>
  <div class="rw-cwv__body">
    <div class="rw-cwv__phone" aria-live="polite">
      <div class="rw-cwv__bar"><i></i><i></i><i></i><span>morgenrot-roesterei.de</span></div>
      <div class="rw-cwv__screen" id="rw-cwv-screen"></div>
    </div>
    <div class="rw-cwv__side">
      <div class="rw-cwv__kicker" id="rw-cwv-kicker"></div>
      <div class="rw-cwv__title" id="rw-cwv-title"></div>
      <div class="rw-cwv__text" id="rw-cwv-text"></div>
      <div class="rw-cwv__actions" id="rw-cwv-actions"></div>
      <div class="rw-cwv__result" id="rw-cwv-result" aria-live="polite"></div>
    </div>
  </div>
  <div class="rw-cwv__note">Alle Zeiten sind Demo-Werte. Aktuelle Zielbereiche stehen in der Dokumentation von Google.</div>
</div>
<style>
.rw-cwv { --w-ink: #1c2233; --w-soft: #5a6272; --w-rule: #dedbd3; --w-card: #ffffff; --w-deep: #f6f4ef; --w-blue: #2c4f9e; --w-blue-soft: #e9eefa; --w-ochre: #b7791f; --w-terra: #c2512c; --w-green: #2f7d4f; font-size: 15px; line-height: 1.45; color: var(--w-ink); font-family: inherit; text-align: left; }
.rw-cwv * { box-sizing: border-box; }
.rw-cwv button { font: inherit; margin: 0; cursor: pointer; }
.rw-cwv button:focus-visible { outline: 2px solid var(--w-ink); outline-offset: 2px; }
.rw-cwv__tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.4em; margin-bottom: 0.8em; }
.rw-cwv__tabs button { display: flex; flex-direction: column; align-items: center; gap: 0.05em; padding: 0.45em 0.3em; border: 1px solid var(--w-rule); border-radius: 0.6em; background: var(--w-card); color: var(--w-ink); line-height: 1.15; }
.rw-cwv__tabs button b { color: var(--w-blue); font-size: 1em; }
.rw-cwv__tabs button span { font-size: 0.78em; color: var(--w-soft); }
.rw-cwv__tabs button.is-on { border-color: var(--w-blue); background: var(--w-blue-soft); box-shadow: inset 0 0 0 1px var(--w-blue); }
.rw-cwv__body { display: grid; grid-template-columns: minmax(0, 15em) minmax(0, 1fr); gap: 1.2em; align-items: start; }
.rw-cwv__phone { border: 2px solid var(--w-ink); border-radius: 1.1em; overflow: hidden; background: var(--w-card); }
.rw-cwv__bar { display: flex; align-items: center; gap: 0.25em; padding: 0.4em 0.6em; background: var(--w-deep); border-bottom: 1px solid var(--w-rule); font-size: 0.72em; color: var(--w-soft); }
.rw-cwv__bar i { width: 0.55em; height: 0.55em; border-radius: 50%; background: var(--w-rule); }
.rw-cwv__bar span { margin-left: 0.4em; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.rw-cwv__screen { position: relative; height: 18em; padding: 0.7em; overflow: hidden; }
.rw-cwv__screen > * { transition: transform 0.25s ease-out; }
.rw-cwv .sk { background: var(--w-deep); border-radius: 0.3em; }
.rw-cwv .sk.pulse { animation: rw-cwv-pulse 1s ease-in-out infinite; }
@keyframes rw-cwv-pulse { 50% { opacity: 0.45; } }
.rw-cwv .pg-h { font-weight: 700; font-size: 1.05em; margin: 0 0 0.3em; }
.rw-cwv .pg-t { font-size: 0.82em; color: var(--w-soft); margin: 0 0 0.5em; }
.rw-cwv .pg-img { height: 8em; border-radius: 0.5em; margin-bottom: 0.6em; display: grid; place-items: center; font-weight: 700; color: #fff; }
.rw-cwv .pg-img.is-on { background: linear-gradient(135deg, #7a3b1d, #c2512c 55%, #e3a857); }
.rw-cwv .pg-price { font-weight: 700; font-size: 1.1em; margin: 0.2em 0 0.5em; }
.rw-cwv .pg-btn { display: block; width: 100%; padding: 0.6em; border: 0; border-radius: 0.6em; background: var(--w-blue); color: #fff; font-weight: 650; }
.rw-cwv .pg-btn.is-busy { background: var(--w-blue); }
.rw-cwv .pg-btn.is-done { background: var(--w-green); }
.rw-cwv .pg-btn.is-pressed { transform: scale(0.97); filter: brightness(0.92); }
.rw-cwv .pg-banner { position: absolute; left: 0.7em; right: 0.7em; top: 0.7em; height: 3.1em; border-radius: 0.5em; background: #fbf5e9; border: 1px solid var(--w-ochre); display: grid; place-items: center; font-size: 0.85em; font-weight: 650; color: #7a4f10; }
.rw-cwv .pg-ghost { position: absolute; left: 0.7em; right: 0.7em; border: 2px dashed var(--w-terra); border-radius: 0.6em; pointer-events: none; }
.rw-cwv .pg-tap { position: absolute; width: 1.6em; height: 1.6em; margin: -0.8em 0 0 -0.8em; border-radius: 50%; border: 2px solid var(--w-terra); background: rgba(194, 81, 44, 0.18); pointer-events: none; }
.rw-cwv__kicker { font-size: 0.75em; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; color: var(--w-blue); }
.rw-cwv__title { font-size: 1.15em; font-weight: 650; margin: 0.2em 0 0.4em; line-height: 1.25; }
.rw-cwv__text { font-size: 0.93em; }
.rw-cwv__actions { display: flex; flex-wrap: wrap; gap: 0.45em; margin-top: 0.8em; }
.rw-cwv__actions button { font-size: 0.9em; font-weight: 600; padding: 0.45em 1em; border-radius: 999px; border: 1px solid var(--w-blue); background: var(--w-blue); color: #fff; }
.rw-cwv__actions button.is-secondary { background: var(--w-card); color: var(--w-ink); border-color: var(--w-rule); }
.rw-cwv__actions button.is-on { box-shadow: 0 0 0 2px var(--w-card), 0 0 0 4px var(--w-blue); }
.rw-cwv__result { margin-top: 0.8em; padding: 0.6em 0.85em; border: 1px solid var(--w-rule); border-left: 3px solid var(--w-blue); border-radius: 0.5em; background: var(--w-deep); min-height: 3.2em; font-size: 0.92em; font-variant-numeric: tabular-nums; }
.rw-cwv__result b { font-weight: 650; }
.rw-cwv__note { margin-top: 0.6em; font-size: 0.78em; color: var(--w-soft); }
@media (max-width: 560px) {
  .rw-cwv__body { grid-template-columns: minmax(0, 1fr); }
  .rw-cwv__phone { max-width: 17em; width: 100%; margin: 0 auto; }
  .rw-cwv__side { order: -1; }
}
</style>
<script>
(function () {
  var screen = document.getElementById("rw-cwv-screen"), result = document.getElementById("rw-cwv-result"), actions = document.getElementById("rw-cwv-actions");
  var tabs = [].slice.call(document.querySelectorAll(".rw-cwv__tabs button"));
  var timers = [], raf = null, cur = "lcp";
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function stop() { timers.forEach(clearTimeout); timers = []; cancelAnimationFrame(raf); }
  function sec(ms) { return (ms / 1000).toFixed(1).replace(".", ",") + " s"; }
  function btn(label, fn, cls) { var b = document.createElement("button"); b.type = "button"; b.textContent = label; if (cls) b.className = cls; b.addEventListener("click", fn); actions.appendChild(b); return b; }
  var INFO = {
    lcp: { k: "LCP · Largest Contentful Paint", t: "Wann ist der größte Inhalt da?", x: "Die Seite lädt. Oben erscheint schnell etwas Text, das große Produktbild aber erst später. LCP misst die Zeit bis zum größten sichtbaren Inhalt im Bildausschnitt." },
    inp: { k: "INP · Interaction to Next Paint", t: "Wie schnell reagiert die Seite?", x: "Ein Tipp auf „In den Warenkorb“ startet die Demo. INP misst die Zeit von der Eingabe bis zur sichtbaren Reaktion, und zwar über alle Eingaben des Besuchs hinweg." },
    cls: { k: "CLS · Cumulative Layout Shift", t: "Bleibt alles an seinem Platz?", x: "Erst die Seite laden, dann auf „Bestellen“ tippen. CLS misst, wie stark Elemente beim Laden ungewollt verrutschen." }
  };
  function show(k) {
    stop(); cur = k; screen.innerHTML = ""; actions.innerHTML = ""; result.innerHTML = "";
    tabs.forEach(function (b) { var on = b.getAttribute("data-k") === k; b.classList.toggle("is-on", on); b.setAttribute("aria-selected", on ? "true" : "false"); });
    document.getElementById("rw-cwv-kicker").textContent = INFO[k].k;
    document.getElementById("rw-cwv-title").textContent = INFO[k].t;
    document.getElementById("rw-cwv-text").textContent = INFO[k].x;
    ({ lcp: setupLcp, inp: setupInp, cls: setupCls })[k]();
  }
  // LCP: Text kommt früh, das große Bild spät
  function setupLcp() {
    var slow = btn("Langsam laden", function () { run(2600); }), fast = btn("Zügig laden", function () { run(700); }, "is-secondary");
    screen.innerHTML = '<div class="sk" style="height:100%"></div>';
    result.textContent = "Noch nicht geladen.";
    function run(T) {
      stop(); slow.classList.toggle("is-on", T > 1000); fast.classList.toggle("is-on", T <= 1000);
      screen.innerHTML = "";
      var t0 = performance.now(), img = null, done = false;
      later(function () {
        screen.innerHTML = '<p class="pg-h">Hausröstung Morgenrot</p><p class="pg-t">Frisch geröstet, im Abo oder einzeln.</p><div class="pg-img sk pulse"></div><div class="sk" style="height:0.8em;width:70%;margin-bottom:0.4em"></div><div class="sk" style="height:0.8em;width:50%"></div>';
        img = screen.querySelector(".pg-img");
      }, reduce ? 0 : 250);
      later(function () { done = true; if (img) { img.className = "pg-img is-on"; img.textContent = "Produktbild"; } result.innerHTML = "<b>Größter Inhalt sichtbar nach " + sec(T) + ".</b> Der Text stand schon früher da. LCP richtet sich nach dem Bild, weil es das größte Element im Ausschnitt ist."; }, T);
      (function tick() { if (done) return; result.innerHTML = "Ladezeit läuft: " + sec(performance.now() - t0); raf = requestAnimationFrame(tick); })();
    }
  }
  // INP: Eingabe, dann sichtbare Reaktion
  function setupInp() {
    var slowMode = true;
    var s = btn("Seite: träge", function () { slowMode = true; mark(); build(); }), f = btn("Seite: flott", function () { slowMode = false; mark(); build(); }, "is-secondary");
    function mark() { s.classList.toggle("is-on", slowMode); f.classList.toggle("is-on", !slowMode); }
    function build() {
      stop();
      screen.innerHTML = '<p class="pg-h">Hausröstung Morgenrot</p><p class="pg-t">500 g, ganze Bohne</p><div class="pg-img is-on">Produktbild</div><p class="pg-price">14,00 €</p><button type="button" class="pg-btn">In den Warenkorb</button>';
      result.textContent = "Jetzt auf „In den Warenkorb“ tippen.";
      var b = screen.querySelector(".pg-btn"), busy = false;
      b.addEventListener("click", function () {
        if (busy) return; busy = true;
        var delay = slowMode ? 1200 : 60;
        result.innerHTML = slowMode ? "Getippt. Sichtbar passiert noch nichts …" : "";
        later(function () {
          b.classList.add("is-pressed"); b.textContent = "Wird hinzugefügt …";
          result.innerHTML = "<b>Sichtbare Reaktion nach " + sec(delay) + ".</b> " + (slowMode ? "Genau diese Wartezeit zwischen Tippen und Reaktion erfasst INP." : "Die Seite bestätigt sofort, auch wenn im Hintergrund noch gearbeitet wird.");
          later(function () { b.classList.remove("is-pressed"); b.classList.add("is-done"); b.textContent = "Im Warenkorb ✓"; later(function () { b.classList.remove("is-done"); b.textContent = "In den Warenkorb"; busy = false; }, 1600); }, 500);
        }, delay);
      });
    }
    mark(); build();
  }
  // CLS: nachgeladenes Banner schiebt Preis und Knopf nach unten
  function setupCls() {
    var load = btn("Seite laden", build);
    screen.innerHTML = '<div class="sk" style="height:100%"></div>';
    result.textContent = "Noch nicht geladen.";
    function build() {
      stop(); load.textContent = "Neu laden";
      screen.innerHTML = '<div class="pg-wrap"><p class="pg-h">Hausröstung Morgenrot</p><p class="pg-t">500 g, ganze Bohne</p><div class="pg-img is-on" style="height:4.5em">Produktbild</div><p class="pg-price">14,00 €</p><button type="button" class="pg-btn">Bestellen</button></div>';
      result.textContent = "Jetzt auf „Bestellen“ tippen.";
      var wrap = screen.querySelector(".pg-wrap"), b = screen.querySelector(".pg-btn"), shifted = false, shiftAt = 0;
      function shift(x, y) {
        if (shifted) return; shifted = true;
        var r0 = b.getBoundingClientRect(), s0 = screen.getBoundingClientRect();
        var ghost = document.createElement("div"); ghost.className = "pg-ghost";
        ghost.style.top = (r0.top - s0.top) + "px"; ghost.style.height = r0.height + "px";
        var banner = document.createElement("div"); banner.className = "pg-banner"; banner.textContent = "Neu: die Herbstsorte ist da";
        wrap.style.transition = "none"; wrap.style.transform = "translateY(3.8em)"; shiftAt = performance.now();
        screen.appendChild(banner); screen.appendChild(ghost);
        if (x !== undefined) { var tap = document.createElement("div"); tap.className = "pg-tap"; tap.style.left = (x - s0.left) + "px"; tap.style.top = (y - s0.top) + "px"; screen.appendChild(tap); }
        result.innerHTML = (x === undefined ? "<b>Das Banner kam nach.</b> Es hat Preis und Knopf nach unten geschoben" : "<b>Der Klick ging ins Leere.</b> Ein nachgeladenes Banner hat Preis und Knopf nach unten geschoben") + ", die gestrichelte Linie zeigt die alte Stelle. Dieses ungewollte Verrutschen misst CLS.";
      }
      b.addEventListener("pointerdown", function (ev) { if (!shifted) { ev.preventDefault(); shift(ev.clientX, ev.clientY); } });
      b.addEventListener("click", function (ev) {
        if (!shifted) { var r = b.getBoundingClientRect(); shift(r.left + r.width / 2, r.top + r.height / 2); return; }
        if (performance.now() - shiftAt < 600) return;
        b.classList.add("is-done"); b.textContent = "Bestellt ✓";
        result.innerHTML = "Beim zweiten Versuch stand der Knopf still. Für die Kundschaft bleibt der erste Fehlklick in Erinnerung.";
      });
      later(function () { if (!shifted) shift(); }, 10000);
    }
  }
  tabs.forEach(function (b) { b.addEventListener("click", function () { show(b.getAttribute("data-k")); }); });
  show("lcp");
})();
</script>
