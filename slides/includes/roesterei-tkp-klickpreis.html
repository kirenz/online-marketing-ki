<!-- Vom TKP zum Klickpreis: fiktives Angebot (100.000 Einblendungen, TKP 6,00 Euro) mit Regler für die angenommene Klickrate. Die Rechnung bleibt bei 600 Euro, Klicks und Kosten je Klick bewegen sich. Gleiches Schaubild wie in der Lernplattform-Lektion online-werbemarkt-planungsprozess (vwa-digitales-marketing). Einbindung im Deck als Raw-HTML-Block. -->
<style>.reveal .rw-tkp { font-size: 0.85em; --w-ink: var(--ink); --w-soft: var(--ink-soft); --w-rule: var(--rule); --w-card: var(--paper); --w-deep: var(--paper-deep); --w-blue: var(--primary); --w-ochre: var(--ochre); --w-terra: var(--terracotta); } .reveal .rw-tkp input[type=range] { width: 100%; } .reveal .rw-tkp__grid { grid-template-columns: repeat(50, 1fr); gap: 3px; } .reveal .rw-tkp__main { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); }</style>
<div class="rw-tkp" id="rw-tkp" lang="de">
  <div class="rw-tkp__offer">
    <div><span>Einblendungen</span><b>100.000</b></div>
    <div><span>TKP</span><b>6,00 €</b></div>
    <div class="is-fixed"><span>Rechnung</span><b>600,00 €</b></div>
  </div>
  <label class="rw-tkp__slider"><span>Angenommene Klickrate: <b id="rw-tkp-rate-v"></b></span>
    <input type="range" id="rw-tkp-rate" min="0.05" max="0.5" step="0.025" value="0.25"></label>
  <div class="rw-tkp__main">
    <div class="rw-tkp__grid" id="rw-tkp-grid" aria-hidden="true"></div>
    <div class="rw-tkp__out">
      <div><span>Klicks</span><b id="rw-tkp-clicks"></b></div>
      <div><span>Kosten je Klick</span><b id="rw-tkp-cpc"></b></div>
    </div>
  </div>
  <div class="rw-tkp__hint" id="rw-tkp-hint" aria-live="polite"></div>
  <div class="rw-tkp__note">Ein Punkt steht für einen Klick, das Raster fasst höchstens 500. Alle Zahlen sind erfunden.</div>
</div>
<style>
.rw-tkp { --w-ink: #1c2233; --w-soft: #5a6272; --w-rule: #dedbd3; --w-card: #ffffff; --w-deep: #f6f4ef; --w-blue: #2c4f9e; --w-blue-soft: #e9eefa; --w-ochre: #b7791f; --w-terra: #c2512c; --w-green: #2f7d4f; font-size: 15px; line-height: 1.45; color: var(--w-ink); font-family: inherit; text-align: left; }
.rw-tkp * { box-sizing: border-box; }
.rw-tkp__offer { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.4em; }
.rw-tkp__offer div, .rw-tkp__out div { border: 1px solid var(--w-rule); border-radius: 0.6em; padding: 0.45em 0.6em; background: var(--w-card); }
.rw-tkp__offer span, .rw-tkp__out span { display: block; font-size: 0.72em; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; color: var(--w-soft); }
.rw-tkp__offer b { font-size: 1.15em; font-variant-numeric: tabular-nums; }
.rw-tkp__offer .is-fixed { border-color: var(--w-ochre); background: #fbf5e9; }
.rw-tkp__slider { display: flex; flex-direction: column; gap: 0.25em; margin: 0.9em 0 0.7em; font-size: 0.95em; }
.rw-tkp__slider input { width: 100%; accent-color: var(--w-blue); margin: 0; }
.rw-tkp input:focus-visible { outline: 2px solid var(--w-ink); outline-offset: 2px; }
.rw-tkp__main { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 0.9em; align-items: stretch; }
.rw-tkp__grid { display: grid; grid-template-columns: repeat(25, 1fr); gap: 2px; align-content: start; padding: 0.5em; border: 1px solid var(--w-rule); border-radius: 0.6em; background: var(--w-deep); }
.rw-tkp__grid i { display: block; aspect-ratio: 1; border-radius: 50%; background: var(--w-rule); transition: background 0.25s; }
.rw-tkp__grid i.on { background: var(--w-blue); }
.rw-tkp__out { display: grid; gap: 0.4em; align-content: start; }
.rw-tkp__out b { display: block; font-size: 1.7em; line-height: 1.15; font-variant-numeric: tabular-nums; }
.rw-tkp__hint { margin-top: 0.8em; padding: 0.65em 0.9em; border: 1px solid var(--w-rule); border-left: 3px solid var(--w-blue); border-radius: 0.5em; background: var(--w-deep); min-height: 4.4em; font-size: 0.92em; }
.rw-tkp__hint b { font-weight: 650; }
.rw-tkp__note { margin-top: 0.5em; font-size: 0.78em; color: var(--w-soft); }
@media (max-width: 480px) { .rw-tkp__main { grid-template-columns: minmax(0, 1fr); } .rw-tkp__out { grid-template-columns: 1fr 1fr; } .rw-tkp__offer b { font-size: 1em; } .rw-tkp__offer span { font-size: 0.6em; letter-spacing: 0.02em; } .rw-tkp__offer div { padding: 0.4em 0.45em; } }
</style>
<script>
(function () {
  var IMPR = 100000, COST = 600, MAX = 500;
  var grid = document.getElementById("rw-tkp-grid"), rate = document.getElementById("rw-tkp-rate"), dots = [];
  for (var i = 0; i < MAX; i++) { var d = document.createElement("i"); grid.appendChild(d); dots.push(d); }
  function de(v, dec) { return v.toLocaleString("de-DE", { minimumFractionDigits: dec, maximumFractionDigits: dec }); }
  function render() {
    var r = parseFloat(rate.value), clicks = Math.round(IMPR * r / 100), cpc = COST / clicks;
    var rtxt = r.toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 3 }) + " %";
    document.getElementById("rw-tkp-rate-v").textContent = rtxt;
    document.getElementById("rw-tkp-clicks").textContent = de(clicks, 0);
    document.getElementById("rw-tkp-cpc").textContent = de(cpc, 2) + " €";
    dots.forEach(function (d, k) { d.classList.toggle("on", k < clicks); });
    var h = "Bei " + rtxt + " sind es <b>" + de(clicks, 0) + " Klicks</b> und <b>" + de(cpc, 2) + " € je Klick</b>. Die Rechnung des Vermarkters bleibt bei 600,00 €. ";
    h += r < 0.2499 ? "Weniger Klicks machen jeden Klick teurer. Beim TKP liegt dieses Risiko bei der Rösterei." : (r > 0.2501 ? "Mehr Klicks machen jeden Klick günstiger. Die Klickrate bleibt aber eine Annahme, keine Zusage." : "Das ist die Annahme aus dem Rechenbeispiel. Der Regler verschiebt sie nach unten oder oben.");
    document.getElementById("rw-tkp-hint").innerHTML = h;
  }
  rate.addEventListener("input", render);
  render();
})();
</script>
